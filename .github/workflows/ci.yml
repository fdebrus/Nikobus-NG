name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Pinned: a new ruff release adds default rules, and would fail a
      # pull request that changes no code. Bump it on purpose.
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.3"
          args: "check --output-format=github"

  test:
    # Against the real Home Assistant and the library's simulated PC-Link.
    name: Tests (real Home Assistant, simulated bus)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      - run: python -m pytest -q

  hassfest:
    name: Hassfest (manifest validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hacs/action@main
        with:
          category: integration
          # brands: not in home-assistant/brands; the logo ships in the
          # integration's own brand folder.
          # license: PolyForm Noncommercial is not in the set GitHub's
          # licence detection knows, so it is never "identified".
          ignore: brands license
